<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>My To-Do List</h1>
    <p class="subtitle" id="summary">Nothing here yet. Add your first task!</p>

    <form id="task-form" class="task-form" autocomplete="off">
      <input
        type="text"
        id="task-input"
        placeholder="What do you need to get done?"
        maxlength="120"
        aria-label="New task"
      />
      <button type="submit">Add</button>
    </form>

    <p id="error-message" class="error" role="alert"></p>

    <div class="filters" id="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Active</button>
      <button class="filter" data-filter="completed">Done</button>
    </div>

    <ul id="task-list" class="task-list"></ul>

    <button id="clear-completed" class="clear-btn" hidden>Clear completed</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
